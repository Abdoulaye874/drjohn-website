{% extends "base.html" %}

{% block content %}
<section class="auth-page">
    <div class="auth-box">
        <h1>Forgot Password</h1>
        <p class="auth-intro">Enter your username and email to receive a password reset link.</p>

        {% if error %}
            <p class="error-message">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('forgot_password') }}">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" value="{{ entered_username or '' }}" autocomplete="username" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ entered_email or '' }}" autocomplete="email" required>

            <button type="submit">Send Reset Link</button>
        </form>

        <p class="auth-switch">
            Remembered it?
            <a href="{{ url_for('login') }}">Log in</a>
        </p>
    </div>
</section>
{% endblock %}
