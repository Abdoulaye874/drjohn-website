{% extends "base.html" %}

{% block content %}
<section class="auth-page">
    <div class="auth-box">
        <h1>Create Account</h1>
        <p class="auth-intro">Create your account to save your session under your own username.</p>

        {% if error %}
            <p class="error-message">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('create_account') }}">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" value="{{ entered_username or '' }}" autocomplete="username" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ entered_email or '' }}" autocomplete="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="new-password" required>

            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required>

            <button type="submit">Create Account</button>
        </form>

        <p class="auth-switch">
            Already have an account?
            <a href="{{ url_for('login') }}">Log in</a>
        </p>
    </div>
</section>
{% endblock %}
